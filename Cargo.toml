[package]
name = "trslat"
version = "0.3.0"
edition = "2024"

[lints.clippy]
all = "warn"
# Pedantic/nursery intentionally omitted: too noisy for a small CLI.
# Enable selectively if a specific lint becomes useful.

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
fluent-bundle = "0.15"
fluent-templates = "0.12"
sys-locale = "0.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
translators = { version = "0.2.0", features = ["google", "tokio-async"] }
thiserror = "2"
