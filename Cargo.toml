[package]
name = "trslat"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
translators = { version = "0.2.0", features = ["google", "tokio-async"] }
